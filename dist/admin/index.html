<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Results Admin · OWAR 2026</title><link rel="stylesheet" href="/styles.css?v=tree-5"></head><body><main class="admin-shell"><div class="admin-top"><div><div class="eyebrow">Race control · <span id="app-version">Loading…</span></div><h1>Publish results</h1></div><a class="back" href="/">View public page ↗</a></div><div class="grid"><section class="panel"><h2>Event tree</h2><div id="event-list"></div></section><aside class="panel"><h2>Private RDF feed</h2><div class="settings"><div class="field"><label>RDF source configuration</label><input id="export-dir" readonly><input id="export-filename" readonly></div><p id="file-status">Loading source status…</p><p id="import-status"></p><div class="field"><label for="event-status">Public result status</label><select id="event-status"><option>Live</option><option>Provisional</option><option>Official</option><option>Finished</option></select></div><button class="btn yellow" id="feed-toggle"></button><button class="btn" id="force-show-all"></button><button class="btn" id="force-read">Force read RDF</button><button class="btn" id="save-setup">Save changes</button></div></aside></div><section class="panel chip-admin"><h2>Registration & timing chips</h2><div class="settings"><div class="field"><label for="chip-return-info">Chip return instructions</label><textarea id="chip-return-info" rows="3" placeholder="For example: Return your chip at the timing desk by 18:00 on Sunday."></textarea></div><button class="btn" id="save-chip-return">Save chip return instructions</button><div class="field"><label for="chip-rider-filter">Riders</label><input id="chip-rider-filter" type="search" placeholder="Filter by rider name or chip code"></div><div id="chip-rider-list" class="chip-rider-list"></div></div></section></main><script src="/admin/admin.js?v=chips-1"></script></body></html>
