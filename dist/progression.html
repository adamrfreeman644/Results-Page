<!doctype html><html><head><meta charset="utf-8"><title>Progression Control</title><style>body{font:14px system-ui;margin:0;background:#f5f7fa;color:#172b45}header{padding:18px 5%;background:#081b34;color:#fff;font-weight:800}main{max-width:1200px;margin:auto;padding:26px}.tabs button{padding:9px 13px;margin-right:7px;border:1px solid #cbd6e1;border-radius:6px;background:#fff;font-weight:700}.tabs button.active{background:#2e5276;color:#fff}.note{padding:13px;background:#eaf2fb;border-radius:8px;margin:16px 0}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.col{background:#fff;border:1px solid #d9e2ec;border-radius:8px;padding:12px;min-height:280px}.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6a7b8e}.tile{border:1px solid #ccd6e1;border-radius:7px;padding:10px;margin:9px 0}.tile b{display:block}.empty{color:#78889a;background:#fafbfd}.status{font-size:11px;color:#60748b}</style></head><body><header>FlowState · Progression Control 0.10.0</header><main><h1 id="title">Open</h1><div class="tabs"><button class="active" onclick="load('open',this)">Open Top 32</button><button onclick="load('women',this)">Women Top 16</button><button onclick="load('groms',this)">Groms Top 16</button></div><div class="note" id="note">Sheet data is provisional. Matching RDF event data is authoritative and replaces it.</div><section class="board" id="board"></section></main><script>const stages={open:['Seeding','Heats 1–8','Quarter-finals 1–4','Semi-finals','Final'],women:['Seeding','Quarter-finals 1–4','Semi-finals','Final','Placement'],groms:['Seeding','Quarter-finals 1–4','Semi-finals','Final','Placement']};async function load(d,b){document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=d==='open'?'Open Top 32':d==='women'?'Women Top 16':'Groms Top 16';let r=await fetch('/api/public/progression/sheet?division='+d),data=await r.json();note.textContent=data.error||('Provisional source: '+data.tab+'. RDF for the same event overrides this data.');board.innerHTML=stages[d].map((s,i)=>'<div class="col"><h2>'+s+'</h2><div class="tile '+(i>1?'empty':'')+'"><b>'+s+'</b><span class="status">'+(i===0?'Sheet seed data':i===1?'Predicted next racers':'Awaiting qualifying RDF')+'</span></div></div>').join('')}</script></body></html>
