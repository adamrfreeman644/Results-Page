services:
  results:
    build: .
    ports:
      - "6543:6543"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      # Same central updater used by your other Byte-Me applications.
      SHARED_UPDATER_URL: ${SHARED_UPDATER_URL:-http://host.docker.internal:8093/apps/results-page}
      # Separate multiple public RaceTec result URLs with a | character.
      RACETEC_URLS: ""
    volumes:
      - results-data:/data
      - racetec-feed:/source:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  racetec-upload:
    image: stilliard/pure-ftpd:hardened
    profiles: ["racetec-upload"]
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    environment:
      PUBLICHOST: ${FTP_PUBLIC_HOST:?Set FTP_PUBLIC_HOST in .env}
      FTP_USER_NAME: ${RACETEC_FTP_USERNAME:?Set RACETEC_FTP_USERNAME in .env}
      FTP_USER_PASS: ${RACETEC_FTP_PASSWORD:?Set RACETEC_FTP_PASSWORD in .env}
      FTP_USER_HOME: /home/ftpusers/racetec
      FTP_PASSIVE_PORTS: 30000:30009
      ADDED_FLAGS: --noanonymous --notruncate --maxclientsperip 2
    volumes:
      - racetec-feed:/home/ftpusers/racetec
    restart: unless-stopped
volumes:
  results-data:
  racetec-feed:
