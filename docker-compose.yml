services:
  results:
    build: .
    ports:
      - "6543:6543"
    environment:
      ADMIN_TOKEN: change-this-to-a-long-random-secret
      POLL_SECONDS: 30
      # Separate multiple public RaceTec result URLs with a | character.
      RACETEC_URLS: ""
    volumes:
      - results-data:/data
    restart: unless-stopped
volumes:
  results-data:
