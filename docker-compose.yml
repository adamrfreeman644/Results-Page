services:
  results:
    build: .
    ports:
      - "6543:6543"
    environment:
      ADMIN_TOKEN: change-this-to-a-long-random-secret
      RDF_FILE: /source/current-race.rdf
      POLL_SECONDS: 5
    volumes:
      # Mount the folder, rather than a single file, so replacement exports are detected.
      - /path/on/byte-me/race-exports:/source:ro
      - results-data:/data
    restart: unless-stopped
volumes:
  results-data:
